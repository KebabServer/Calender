name: Deploy Daymark to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - name: Build demo for browser tests
        env:
          VITE_BASE_PATH: /Calender/
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_PUBLISHABLE_KEY: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run build
      - run: npm run test:e2e
      - name: Build mocked cloud app for regression tests
        env:
          VITE_BASE_PATH: /Calender/
          VITE_SUPABASE_URL: https://tktgencmwtanxjfkiadc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mock_for_intercepted_tests
        run: npm run build
      - run: npm run test:cloud
      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
